
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libmpv-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1

  verify-macos:
    name: Verify (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # cargo test links the test binary against libmpv, as the release job does (build.rs finds Homebrew's copy).
      - name: Install libmpv
        run: brew install mpv

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      # cargo test links against libmpv (LNK1181 'mpv.lib' without it). Same source and import library as release.yml.
      - name: Get libmpv (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/zhongfly/mpv-winbuild/releases/latest | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d' } | Select-Object -First 1
          if (-not $asset) { throw "No mpv-dev-x86_64 asset in the latest mpv-winbuild release" }
          gh release download $release.tag_name --repo zhongfly/mpv-winbuild --pattern $asset.name --dir mpv-dev
          7z x "mpv-dev/$($asset.name)" -ompv-dev/x
          "MPV_DEV_DIR=$((Resolve-Path mpv-dev/x).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Make the MSVC import library
        shell: pwsh
        run: |
          $exports = dumpbin /exports "$env:MPV_DEV_DIR\libmpv-2.dll" | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(mpv_\S+)') { $Matches[1] } }
          if (-not $exports) { throw "No mpv_* exports found in libmpv-2.dll" }
          "EXPORTS`n" + ($exports -join "`n") | Out-File -Encoding ascii "$env:MPV_DEV_DIR\mpv.def"
          lib /def:"$env:MPV_DEV_DIR\mpv.def" /name:libmpv-2.dll /out:"$env:MPV_DEV_DIR\mpv.lib" /MACHINE:X64
          "RUSTFLAGS=-L native=$env:MPV_DEV_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The test binaries load libmpv-2.dll at start (STATUS_DLL_NOT_FOUND otherwise). Windows looks next to the exe
          # first, so the DLL goes where cargo puts the test binaries; PATH gets the folder as well.
          if (-not (Test-Path "$env:MPV_DEV_DIR\libmpv-2.dll")) { throw "libmpv-2.dll missing from $env:MPV_DEV_DIR" }
          New-Item -ItemType Directory -Force src-tauri/target/debug/deps | Out-Null
          Copy-Item "$env:MPV_DEV_DIR\libmpv-2.dll" src-tauri/target/debug/deps/
          Copy-Item "$env:MPV_DEV_DIR\libmpv-2.dll" src-tauri/target/debug/
          $env:MPV_DEV_DIR | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # libmpv-2.dll imports vulkan-1.dll (the Vulkan loader). The runner has no GPU driver and so no loader, and the test
      # binary then stops with STATUS_DLL_NOT_FOUND although libmpv-2.dll itself is found. The runtime only supplies
      # the loader; no GPU is needed for the tests.
      - name: Install the Vulkan loader (Windows)
        shell: pwsh
        run: |
          choco install vulkan-runtime -y --no-progress
          if (-not (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) { throw "vulkan-1.dll still missing" }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1
